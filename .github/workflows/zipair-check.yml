name: ZIPAIR fare check

# Runs every 12 hours via GitHub's cron (may fire late — GitHub throttles
# scheduled workflows, but at this cadence that's fine). workflow_dispatch
# stays available for manual runs from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours (UTC)

permissions:
  contents: write            # allow the job to commit updated state.json

concurrency:
  group: zipair-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ZIPAIR fares
        env:
          ZIPAIR_SMTP_USER: ${{ secrets.ZIPAIR_SMTP_USER }}
          ZIPAIR_SMTP_PASS: ${{ secrets.ZIPAIR_SMTP_PASS }}
          ZIPAIR_MAIL_TO: ${{ secrets.ZIPAIR_MAIL_TO }}
        run: python3 zipair_monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet state.json; then
            git add state.json
            git commit -m "Update fare state [skip ci]"
            git push
          else
            echo "No state change."
          fi
